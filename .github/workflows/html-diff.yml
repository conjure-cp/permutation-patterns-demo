name: Generated HTML diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  html-diff:
    name: Compare generated HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Build base export
        run: |
          mkdir build
          cp -r assets component styles index.html build
          cp *.json *.html *.js combined.essence build
          mkdir -p "$RUNNER_TEMP/base-html"
          find build -name "*.html" -type f -exec cp --parents {} "$RUNNER_TEMP/base-html" \;

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build PR export
        run: |
          mkdir build
          cp -r assets component styles index.html build
          cp *.json *.html *.js combined.essence build
          mkdir -p "$RUNNER_TEMP/head-html"
          find build -name "*.html" -type f -exec cp --parents {} "$RUNNER_TEMP/head-html" \;

      - name: Compare exported HTML
        id: diff
        run: |
          status=0
          diff -ru "$RUNNER_TEMP/base-html/build" "$RUNNER_TEMP/head-html/build" > "$RUNNER_TEMP/generated-html.diff" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Could not compare the generated HTML (diff exited with $status)."
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Generated HTML changed"
              echo
              echo "Generated HTML must match the base branch. Review the uploaded \`generated-html-diff\` artifact."
              echo
              echo '```diff'
              head -n 200 "$RUNNER_TEMP/generated-html.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Generated HTML unchanged"
              echo
              echo "The exported HTML files match the base branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated HTML diff
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-html-diff
          path: ${{ runner.temp }}/generated-html.diff
          if-no-files-found: error

      - name: Fail on generated HTML changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::Generated HTML differs from the base branch. Review the generated-html-diff artifact and job summary."
          exit 1
